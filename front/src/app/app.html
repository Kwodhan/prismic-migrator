<mat-toolbar color="primary">

  <span class="toolbar-title">Prismic Migrator</span>
  <a mat-button routerLink="/custom-type" routerLinkActive="active-link">
    <mat-icon>build</mat-icon>
    Custom Type
  </a>
  <a mat-button routerLink="/asset" routerLinkActive="active-link">
    <mat-icon>image</mat-icon>
    Asset
  </a>
  <a mat-button routerLink="/document" routerLinkActive="active-link">
    <mat-icon>description</mat-icon>
    Document
  </a>
  <button mat-button [matMenuTriggerFor]="helpMenu">
    <mat-icon>help</mat-icon>
    Help
  </button>
  <mat-menu #helpMenu="matMenu">
    @for (env of environments(); track env.repoName) {
      <a mat-menu-item [href]="'https://' + env.repoName + '.prismic.io'" target="_blank">{{ env.repoName }}</a>
    }
    <mat-divider/>
    <a mat-menu-item routerLink="/">Find Documents by Slice</a>
  </mat-menu>
  <span class="spacer"></span>
  <a mat-button routerLink="/" routerLinkActive="active-link">
    <mat-icon>home</mat-icon>
    Environments
  </a>

  @if (auth.claims(); as claims) {
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
      <mat-icon>account_circle</mat-icon>
      <span
        class="user-label">{{ claims['name'] || claims['preferred_username'] || claims['email'] || claims['sub'] }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="user-menu-header">{{ claims['email'] }}</div>
      <mat-divider/>
      <button mat-menu-item (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        Sign out
      </button>
    </mat-menu>
  }

</mat-toolbar>

<router-outlet/>
